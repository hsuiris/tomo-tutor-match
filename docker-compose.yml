# 一個指令啟動整個沙盒：docker compose up --build
# App 跑在 http://localhost:3300，資料庫在獨立的 db 容器內

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutormatch
      # 必須由環境提供；產生：openssl rand -base64 24
      # 注意：只在 pgdata volume 為空時生效，改密碼要先 docker compose down -v
      POSTGRES_PASSWORD: ${DB_PASSWORD:?請先設定 DB_PASSWORD 環境變數（openssl rand -base64 24）}
      POSTGRES_DB: tutormatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutormatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tutormatch:${DB_PASSWORD}@db:5432/tutormatch?schema=public
      # 必須由環境提供（未設定就直接報錯，不給不安全的預設值）
      # 產生方式：openssl rand -base64 33
      AUTH_SECRET: ${AUTH_SECRET:?請先設定 AUTH_SECRET 環境變數（openssl rand -base64 33）}
      AUTH_TRUST_HOST: "true"
    ports:
      # 主機 3300 → 容器 3000（避開本機其他佔用 3000 的服務）
      - "3300:3000"

volumes:
  pgdata:
